<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeKiwi 업데이트 관리자</title><link rel="stylesheet" href="/admin.css"><script defer src="/admin.js"></script><main><h1>업데이트 관리자</h1><p>로봇이 직접 백업·업데이트·복구합니다 · 조종 PIN과 별도 관리자 인증</p><form id="login"><label>관리자 비밀번호<input id="password" type="password" minlength="6" pattern="([0-9]{6}|.{16,256})" maxlength="256" autocomplete="current-password" required></label><button>로그인</button></form><section id="panel" hidden><button id="logout">로그아웃</button><button id="check">검증 릴리스 확인</button><p id="availability" role="status">로그인하면 검증된 새 버전을 확인합니다.</p><label>적용할 릴리스<select id="release"><option value="">먼저 릴리스를 확인하세요</option></select></label><pre id="notes"></pre><label><input id="isolated" type="checkbox">앱에서 모터 활성화·조종·기록을 종료했고, 다른 사람이 조종하지 않음을 확인했습니다.</label><button id="apply" disabled>선택한 버전으로 업데이트</button><button id="recover">중단 복구 후 서비스 재검증·잠금 해제</button><p>업데이트 중 로봇 웹이 잠시 끊깁니다. 실패하면 이전 앱을 복원하고, 복구 실패 시 조종을 계속 차단합니다. OS·드라이버·데이터 형식 변경은 수동 업데이트가 필요합니다.</p></section><p id="status" role="status"></p><p id="error" role="alert"></p></main></html>
