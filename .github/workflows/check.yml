name: Source checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s app -p test_control.py -v
      - run: python -m unittest discover -s tests -v
      - run: node --check app/app.js
      - run: bash -n install.sh prepare-system.sh start.sh
      - run: node --check updater/admin.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-test.txt
      - run: npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.1
      - run: node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
      - run: node tests/browser_smoke.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/browser/node_modules
          TEST_PYTHON: python
      - run: node tests/admin_browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/browser/node_modules
          TEST_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-control-center-browser
          path: private/control-center-evidence
